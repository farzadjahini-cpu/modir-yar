<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e4fd8">
<title>همیار هنرستان</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="login-screen" class="hidden">
  <div class="login-card">
    <div class="logo-badge">🏫</div>
    <h1>همیار هنرستان</h1>
    <p class="muted" id="login-school"></p>
    <label>نام کاربری</label>
    <input id="login-username" autocomplete="username" placeholder="مثلاً modir">
    <label>رمز عبور</label>
    <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••">
    <button id="login-btn" class="btn primary block">ورود</button>
    <p id="login-error" class="error"></p>
    <p class="muted small">سال تحصیلی <span id="login-year"></span> — نسخه ۱.۰</p>
  </div>
</div>

<div id="app-shell" class="hidden">
  <aside id="sidebar">
    <div class="side-header">
      <div class="logo-badge small">🏫</div>
      <div><b>همیار هنرستان</b><br><span class="muted small" id="side-year"></span></div>
    </div>
    <nav id="menu"></nav>
    <div class="side-footer">
      <div id="user-chip"></div>
      <button id="logout-btn" class="btn ghost block">خروج از حساب</button>
    </div>
  </aside>
  <div id="overlay" onclick="App.toggleSidebar(false)"></div>
  <main>
    <header id="topbar">
      <button id="burger" onclick="App.toggleSidebar()">☰</button>
      <h2 id="page-title">داشبورد</h2>
      <span id="sync-badge" class="badge">آفلاین</span>
      <button id="theme-btn" onclick="App.toggleTheme()">🌙</button>
    </header>
    <section id="content"></section>
  </main>
</div>

<div id="toast-wrap"></div>
<script src="js/jalali.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
